[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgv-ptycho-sim"
version = "0.1.0"
description = "Simulation scaffold for TGV waist measurement with ptychography / PIE."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "TGV Ptycho Simulation Contributors" }
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pyyaml",
  "tqdm",
  "pandas",
  "h5py",
  "zarr",
  "tifffile",
  "imageio",
  "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "ipykernel", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--basetemp=.pytest_tmp"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
