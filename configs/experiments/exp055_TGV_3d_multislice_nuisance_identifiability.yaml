  connectivity: six_neighbor_cartesian_lattice
  profile_definition: minimum_raw_loss_over_registered_nuisance_grid_at_each_d_waist
  q8_fiber:
    max_adjacent_cells_per_direction: 256
    boundary_bisection_iterations: 24
    boundary_resolution_m_max: 1.0e-12
  multistart_paths:
    algorithm: deterministic_six_neighbor_steepest_descent_on_frozen_local_grid
    start_indices:
      - [0, 0, 0]
      - [0, 8, 8]
      - [8, 0, 8]
      - [8, 8, 0]
    maximum_moves_per_start: 32
    tie_break: lexicographic_parameter_index
    equal_grid_and_move_budget: true
  local_diagnostic:
