    z_waist_m: [4.5e-5, 4.75e-5, 5.0e-5, 5.25e-5, 5.5e-5]
  local_grid:
    d_waist_m: [1.95e-5, 1.9625e-5, 1.975e-5, 1.9875e-5, 2.0e-5, 2.0125e-5, 2.025e-5, 2.0375e-5, 2.05e-5]
