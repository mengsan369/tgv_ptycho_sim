design_matrix:
  - id: C0
    label: open_multislice_plane_wave_legacy_B_baseline
    large_canvas: false
    illumination: plane_wave
    blind_mode: exp044_formal_single_initialization
    authoritative_bridge: exp043_hash_locked_E43
  - id: C1
    label: large_canvas_only
    large_canvas: true
    illumination: plane_wave
    blind_mode: exp044_formal_single_initialization
  - id: C2
    label: localized_illumination_only
    large_canvas: false
    illumination: gaussian_A_entrance
    blind_mode: exp044_formal_single_initialization
  - id: C3
    label: combined_primary
    large_canvas: true
    illumination: gaussian_A_entrance
    blind_mode: exp044_formal_two_initializations

optics:
  wavelength_m: 5.32e-7
  internal_reference_index: 1.5
  external_medium_index: 1.0
  z_AB_m: 5.0e-4
  z_BC_m: 1.0e-3
  angular_spectrum_bandlimit: true
  alias_control_external: true

sample_a:
  model: axisymmetric_tgv_q8_cell_average_scalar_multislice
  native_shape: [96, 96]
  open_shape: [256, 256]
  support_control_open_shape: [320, 320]
  dx_m: 5.0e-7
  thickness_m: 1.0e-4
  target_dz_m: 1.0e-6
  interface_factor: 8
  d_top_m: 3.0e-5
  d_waist_m: 2.0e-5
  d_bottom_m: 3.0e-5
  z_waist_m: 5.0e-5
  center_xy_m: [0.0, 0.0]
  n_glass: 1.5
  n_air: 1.0

illumination:
  selected_type: gaussian_A_entrance
  waist_plane: sample_A_entrance
  amplitude_definition: A0_exp_minus_r2_over_w2
  spot_diameter_1e2_intensity_m: 4.8e-5
  power_convention: fixed_total_analytic_gaussian_power
  analytic_total_power_reference_m2: 2.304e-9
  reference_power_definition: unit_plane_wave_over_48um_square_native_A_aperture
  center_xy_m: [0.0, 0.0]
  curvature: none
  decenter_tilt_astigmatism_aberration: none
  large_spot_limit_diameter_m: 1.6e-3

sample_b:
  phase_range_rad: 0.8
  feature_size_m: 2.0e-6
  dx_m: 5.0e-7
  core_cells_shape: [48, 48]
  core_seed: 20260840
  master_cells_shape: [64, 64]
  extension_seed: 20260944
  master_shape: [256, 256]
  master_physical_size_m: [1.28e-4, 1.28e-4]
  interaction_window_shape: [192, 192]
  interaction_window_physical_size_m: [9.6e-5, 9.6e-5]
  transparent_exterior: [1.0, 0.0]
  reconstruction_active_mask: illuminated_scan_union
  never_illuminated_pixels_optimized: false
  low_coverage_definition: positive_coverage_at_or_below_first_quartile

scan:
  source: exp042_authoritative_positions
  position_columns: [x, y]
  position_units: m
  integer_pixel_shifts_only: true
  expected_count: 25
  expected_span_xy_m: [1.8e-5, 1.8e-5]
  feature_alignment_px: 4
  required_minimum_margin_m: 1.0e-6

probe_parameterization:
  native_shape: [96, 96]
  open_shape: [256, 256]
  node_dx_m: 5.0e-7
  localized_reference: homogeneous_gaussian_propagated_through_glass_and_AB
  unknown: centered_native_TGV_induced_residual_about_registered_reference

detector:
  model: q4_positive_staggered_midpoint_pixel_average
  quadrature_factor: 4
  node_dx_m: 5.0e-7
  pixel_size_m: 2.0e-6
  native_roi_shape: [32, 32]
  native_roi_fov_m: [6.4e-5, 6.4e-5]
  primary_open_shape: [256, 256]
  support_control_open_shape: [320, 320]
  crop: centered_after_pixel_quadrature

loss:
  type: mean_half_squared_pixel_intensity_residual
  amplitude_replacement: false

development:
  cases: [C0, C3]
  known_b:
    control_outer_iterations: 6
    spectral_radius_power_iterations: 6
    cg_max_iterations: 8
  blind:
    outer_sweeps: 2
    branches: [homogeneous_B]

known_b:
  method: batch_spectrally_damped_gauss_newton_cg_armijo
  initialization: registered_homogeneous_reference_probe
  known_sample_b: true
  update_sample_b: false
  truth_used_by_optimizer: false
  optimizer:
    control_algorithm: batch_spectrally_damped_gauss_newton_cg_armijo
    control_outer_iterations: 6
    spectral_radius_power_iterations: 6
    spectral_radius_seed: 20260945
    damping_relative_to_spectral_radius: 1.0e-4
    cg_max_iterations: 8
    cg_relative_residual_tolerance: 0.0
    line_search_initial_scale: 1.0
    truth_used_by_spectral_radius: false
    truth_used_by_damping: false
    truth_used_by_cg: false
    truth_used_by_branch_selection: false
    truth_used_by_stopping: false
  armijo:
    backtracking_factor: 0.5
    armijo_c: 1.0e-4
    max_backtracking_steps: 24
    minimum_step: 1.0e-12
    gradient_norm_stop: 0.0

blind:
  algorithm: alternating_block_spectrally_damped_gn_cg
  outer_sweeps: 6
  checkpoint_selection_rule: fixed_final_outer_sweep
  branch_execution_rule: C1_C2_C3_enter_only_if_forward_and_known_b_measurement_gates_pass
  representative_branch: homogeneous_B
  initial_probe: registered_homogeneous_reference_probe
  initializations:
    - name: homogeneous_B
      kind: homogeneous_transmission
      seed: 20260946
      phase_rms_rad: 0.05
    - name: seeded_phase_B
      kind: seeded_zero_mean_phase
      seed: 20260947
      phase_rms_rad: 0.05
  probe_block:
    outer_iterations: 1
    spectral_radius_power_iterations: 3
    spectral_radius_seed: 20260948
    damping_relative_to_spectral_radius: 1.0e-4
    cg_max_iterations: 4
    cg_relative_residual_tolerance: 0.0
    line_search_initial_scale: 1.0
    backtracking_factor: 0.5
    armijo_c: 1.0e-4
    max_backtracking_steps: 24
    minimum_step: 1.0e-12
    gradient_norm_stop: 0.0
    truth_used_by_optimizer: false
    truth_used_by_spectral_radius: false
    truth_used_by_damping: false
    truth_used_by_stopping: false
  sample_b_block:
    parameterization: phase_only_unit_modulus_on_active_support
    outer_iterations: 1
    spectral_radius_power_iterations: 3
    spectral_radius_seed: 20260949
    damping_relative_to_spectral_radius: 1.0e-4
    cg_max_iterations: 4
    cg_relative_residual_tolerance: 0.0
    line_search_initial_scale: 1.0
    backtracking_factor: 0.5
    armijo_c: 1.0e-4
    max_backtracking_steps: 24
    minimum_step: 1.0e-12
    gradient_norm_stop: 0.0
    truth_used_by_optimizer: false
    truth_used_by_spectral_radius: false
    truth_used_by_damping: false
    truth_used_by_stopping: false
  truth_used_by_initialization: false
  truth_used_by_optimizer: false
  truth_used_by_checkpoint_selection: false
  truth_used_by_stopping: false

conditioning:
  random_seed: 20260950
  random_direction_count: 6
  direction_normalization: unit_l2_on_registered_parameter_mask
  reported_statistics: [minimum, median, maximum]
  truth_used_for_case_selection: false

formal_thresholds:
  forward_replay_relative_l2_max: 1.0e-13
  scan_window_adjoint_relative_error_max: 1.0e-11
  propagation_linear_adjoint_relative_error_max: 1.0e-11
  intensity_jacobian_adjoint_relative_error_max: 1.0e-10
  combined_loss_directional_gradient_relative_error_max: 2.0e-5
  source_residual_edge_energy_fraction_max: 5.0e-3
  localized_probe_support_control_relative_l2_max: 2.0e-2
  detector_padding_control_relative_l2_max: 4.0e-2
  minimum_physical_margin_m: 1.0e-6
  localized_captured_power_fraction_min: 0.999
  known_b_detector_relative_residual_max: 1.5e-2
  known_b_probe_aligned_relative_l2_max: 2.3e-1
  blind_detector_relative_residual_max: 4.0e-2
  repeat_prediction_relative_l2_max: 1.0e-2
  blind_probe_aligned_relative_l2_max: 2.5e-1
  blind_coverage_weighted_B_relative_l2_max: 3.5e-1
  blind_exit_wave_product_relative_l2_max: 2.5e-1
  required_relative_improvement_vs_exp043_B_min: 1.0e-1
  required_relative_improvement_vs_exp043_exit_min: 1.0e-1

artifact_contract:
  required_entry_children:
    - config_yaml
    - data
    - instrument
    - sample
    - truth
    - reconstruction
    - metadata
    - metrics
  calibration_group_required: false
  preprocessing_group_required: false
  all_numeric_datasets_finite: true

