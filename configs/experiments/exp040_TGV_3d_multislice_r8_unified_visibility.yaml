run:
  name: exp040_TGV_3d_multislice_r8_unified_visibility
  output_root: runs

experiment:
  id: exp040
  phase: Phase 4
  status: Inconclusive
  description: Pre-registered exp040 R8 unified q8 convergence and waist-visibility diagnostic.

optics:
  wavelength_m: 5.32e-7
  internal_reference_index: 1.5
  external_medium_index: 1.0
  baseline_shape: [128, 128]
  baseline_dx_m: 5.0e-7
  z_AB_m: 5.0e-4
  z_BC_m: 1.0e-3
  angular_spectrum_bandlimit: true
  detector:
    pixel_size_m: 5.0e-7
    model: grid_sampled_intensity
    pixel_integration: false

illumination:
  type: plane_wave
  amplitude: 1.0
  theta_x_rad: 0.0
  theta_y_rad: 0.0
  seed: null

sample_a:
  type: single_axisymmetric_air_filled_tgv_in_glass
  center_xy_m: [0.0, 0.0]
  thickness_m: 1.0e-4
  d_top_m: 3.0e-5
  d_waist_m: 2.0e-5
  d_bottom_m: 3.0e-5
  z_waist_m: 5.0e-5
  n_glass: 1.5
  n_air: 1.0
  voxelization: voxel_center_binary

multislice:
  operator: centered_symmetric_split_step
  slice_location: center_plane
  returned_field_plane: sample_a_exit_boundary
  target_dz_m: 1.0e-6
  use_true_slice_widths: true
  propagate_between_slices: true
  store_slice_fields: false

sample_b:
  type: random_phase
  phase_range_rad: 0.8
  physical_feature_size_m: 2.0e-6
  seed: 20260840
  canonical_grid:
    shape: [384, 384]
    dx_m: 2.5e-7
    fov_m: [9.6e-5, 9.6e-5]
  case_mapping: centered_crop_then_aligned_point_sampling
  same_physical_realization_for_all_cases: true
  object_boundary: periodic

scan:
  type: jittered_grid
  num_x: 5
  num_y: 5
  step_m: 4.0e-6
  center: true
  integer_pixel_shifts_only: true
  max_jitter_px: 1
  jitter_quantum_m: 1.0e-6
  jitter_seed: 20260841
  same_positions_for_all_cases: true

waist_perturbation:
  delta_d_waist_m: 2.0e-6
  case_ids: [waist_minus, baseline, waist_plus]
  d_waist_m: [1.8e-5, 2.0e-5, 2.2e-5]
  shared_incident_field: true
  shared_sample_b: true
  shared_scan: true
  shared_detector_model: true

convergence:
  comparison_mapping: centered_bilinear_interpolation_diagnostic_only
  comparison_mapping_is_detector_model: false
  axial:
    fixed_shape: [128, 128]
    fixed_dx_m: 5.0e-7
    dz_cases_m: [2.0e-6, 1.0e-6, 5.0e-7]
    acceptance_pair_m: [1.0e-6, 5.0e-7]
  lateral_fixed_fov:
    fov_m: [6.4e-5, 6.4e-5]
    cases:
      - shape: [64, 64]
        dx_m: 1.0e-6
      - shape: [128, 128]
        dx_m: 5.0e-7
      - shape: [256, 256]
        dx_m: 2.5e-7
    acceptance_pair_dx_m: [5.0e-7, 2.5e-7]
    comparison_grid_shape: [128, 128]
    comparison_grid_dx_m: 5.0e-7
  fov:
    fixed_dx_m: 5.0e-7
    shapes: [[128, 128], [160, 160], [192, 192]]
    common_center_roi_shape: [128, 128]
    common_center_roi_fov_m: [6.4e-5, 6.4e-5]
    acceptance_pair_shapes: [[160, 160], [192, 192]]

diagnostics_r1:
  enabled: false
  sample_b_refinement:
    base_grid:
      shape: [768, 768]
      dx_m: 1.25e-7
      fov_m: [9.6e-5, 9.6e-5]
      coarse_phase_cell_shape: [48, 48]
    working_grid:
      shape: [1024, 1024]
      dx_m: 1.25e-7
      fov_m: [1.28e-4, 1.28e-4]
    extension: centered_periodic_tile_of_base_96um
    extension_each_side_px: [128, 128]
    same_seed_as_r0: true
    r0_mapping_max_complex_error: 1.0e-12

diagnostics_r2:
  enabled: false
diagnostics_r3:
  enabled: false
diagnostics_r4:
  enabled: false
diagnostics_r5:
  enabled: false
diagnostics_r6:
  enabled: false
diagnostics_r7:
  enabled: false

diagnostics_r8:
  enabled: true
  version: R8
  scientific_role: unified_q8_axial_lateral_open_floor_and_waist_visibility
  methods:
    interface: q8_staggered_midpoint_air_area_fraction
    effective_index: linear_cell_average_of_indicator
    multislice: centered_symmetric_split_step_streamed_slices
    sample_a_cases: q8_axial_lateral_and_finest_waist_sweep
    lateral_comparison_mapping: finest_to_coarse_centered_bilinear_complex_field
    a_to_detector_mapping: centered_bilinear_scattered_residual
    finite_b: same_nominal_96um_hard_edge_transparent_exterior
    finite_shift: constant_zero_shift_of_b_minus_one
    ab_propagation: alias_controlled_same_grid_192um
    open_bc: residual_alias_controlled_288_384um
    detector: q4_staggered_midpoint_uniform_positive_weights
    comparison: unaligned_relative_l2_registered_reference_denominators
  r7_provenance:
    run: runs/exp040_TGV_3d_multislice_r7_subvoxel_interface_20260813_011329
    metrics_sha256: F7C26CC9B14778704C4F14B660515A8CD710B750A5C1E5EB0A868969CB4324BE
    hdf5_sha256: 34D10D9FB506BD76FE887041788B803D74A1138E0E434140878686E649258551
    status: Passed
    q4_to_q8_u_a_exit: 0.0198499
    q4_to_q8_p_b: 0.000498961
    q4_to_q8_i_stack: 0.000250482
  r6_context:
    run: runs/exp040_TGV_3d_multislice_r6_b_support_sensitivity_20260811_200120
    metrics_sha256: 5813692089C374892D961152250225F71CE05843828A5F8D9FBE5CEBA33B987A
    maximum_nominal_b_variation: 0.17129597874704286
    combined_with_r8_metrics: false
    used_in_r8_gate: false
  interface:
    factor: 8
    node_rule: pixel_center_plus_a_half_over_q
    weights: uniform_nonnegative
    axial_subnodes: 1
  sample_a_cases:
    fov_m: [6.4e-5, 6.4e-5]
    cases:
      - id: axial_coarse
        shape: [256, 256]
        dx_m: 2.5e-7
        dz_m: 5.0e-7
        d_waist_m: 2.0e-5
      - id: common_reference
        shape: [256, 256]
        dx_m: 2.5e-7
        dz_m: 2.5e-7
        d_waist_m: 2.0e-5
      - id: finest_baseline
        shape: [512, 512]
        dx_m: 1.25e-7
        dz_m: 2.5e-7
        d_waist_m: 2.0e-5
      - id: waist_minus
        shape: [512, 512]
        dx_m: 1.25e-7
        dz_m: 2.5e-7
        d_waist_m: 1.8e-5
      - id: waist_plus
        shape: [512, 512]
        dx_m: 1.25e-7
        dz_m: 2.5e-7
        d_waist_m: 2.2e-5
    axial_pair: [axial_coarse, common_reference]
    axial_reference: common_reference
    lateral_pair: [common_reference, finest_baseline]
    lateral_reference: finest_baseline
    waist_cases: [waist_minus, finest_baseline, waist_plus]
    waist_reference: finest_baseline
    reuse_common_cases: true
    stream_slices: true
    retain_full_volumes: false
  detector_sampling:
    quadrature_factor: 4
    node_dx_m: 1.25e-7
    base_fov_m: [1.92e-4, 1.92e-4]
    base_node_shape: [1536, 1536]
    primary_open_fov_m: [3.84e-4, 3.84e-4]
    primary_open_node_shape: [3072, 3072]
    native_roi_shape: [128, 128]
    selected_scan_index: 0
    stream_scans: true
    retain_full_node_stacks: false
  finite_b:
    physical_shape_m: [9.6e-5, 9.6e-5]
    canonical_phase_cells: [48, 48]
    exterior_transmission_real: 1.0
    exterior_transmission_imag: 0.0
  open_control:
    case_id: finest_baseline
    fov_m: [[2.88e-4, 2.88e-4], [3.84e-4, 3.84e-4]]
    node_shapes: [[2304, 2304], [3072, 3072]]
    acceptance_pair: [open_288, open_384]
    reference: open_384
    denominator: open_384_finest_baseline_i_stack
  comparisons:
    outputs: [U_A_exit, P_B, I_stack]
    axial_denominator: common_reference
    lateral_denominator: finest_baseline
    waist_denominator: finest_baseline
    lateral_u_a_exit_common_grid: [256, 256]
    lateral_u_a_exit_common_dx_m: 2.5e-7
    detector_floor_components: [axial, lateral, open]
    detector_visibility_uses_full_stack: true
    phase_scale_spatial_alignment: false
  determinism:
    case_id: finest_baseline
    scan_index: 0
    open_reference: open_384
  thresholds:
    reuse_acceptance_convergence_relative_l2_max: true
    reuse_acceptance_algebra_relative_l2_max: true
    reuse_acceptance_determinism_relative_l2_max: true
    reuse_detector_visibility_signal_to_floor_min: true

controls:
  geometry: true
  zero_contrast: true
  single_slice: true
  no_internal_propagation: true
  projected_phase_product: true
  axial_convergence: true
  lateral_convergence: true
  fov_convergence: true
  end_to_end_detector: true
  waist_visibility: true
  determinism_and_finite: true

acceptance:
  geometry_thickness_absolute_tolerance_m:
    fixed_floor_m: 1.0e-15
    floating_point_factor: 16.0
    rule: max(fixed_floor_m, floating_point_factor * eps_float64 * thickness_m)
  algebra_relative_l2_max: 1.0e-12
  zero_contrast_relative_l2_max: 1.0e-12
  single_slice_relative_l2_max: 1.0e-12
  projected_phase_product_relative_l2_max: 1.0e-12
  determinism_relative_l2_max: 1.0e-14
  convergence_relative_l2_max: 5.0e-2
  convergence_outputs: [U_A_exit, P_B, I_stack]
  require_all_finite: true
  detector_visibility_signal_to_floor_min: 3.0
  detector_floor_components: [axial, lateral, fov]
  detector_visibility_rule: min(waist_minus_signal, waist_plus_signal) / max(axial_floor, lateral_floor, fov_floor, eps_float64)
  report_only_signal_to_floor_outputs: [U_A_exit, P_B]

output:
  save_hdf5: true
  save_png: true
  save_slice_fields: false
  save_r1_figures: false
  save_r2_figures: false
  save_r3_figures: false
  save_r4_figures: false
  save_r5_figures: false
  save_r6_figures: false
  save_r7_figures: false
  save_r8_figures: true
  hdf5_filename: exp040_multislice_r8_unified_visibility.h5
