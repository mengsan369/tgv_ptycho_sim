run:
  name: exp040_TGV_3d_multislice_r9_a_exit_attribution
  output_root: runs

experiment:
  id: exp040
  phase: Phase 4
  status: Inconclusive
  description: Pre-registered exp040 R9 A-exit raw/passband, restriction, and axial attribution diagnostic.

optics:
  wavelength_m: 5.32e-7
  internal_reference_index: 1.5
  external_medium_index: 1.0
  baseline_shape: [128, 128]
  baseline_dx_m: 5.0e-7
  z_AB_m: 5.0e-4
  z_BC_m: 1.0e-3
  angular_spectrum_bandlimit: true
  detector:
    pixel_size_m: 5.0e-7
    model: grid_sampled_intensity
    pixel_integration: false

illumination:
  type: plane_wave
  amplitude: 1.0
  theta_x_rad: 0.0
  theta_y_rad: 0.0
  seed: null

sample_a:
  type: single_axisymmetric_air_filled_tgv_in_glass
  center_xy_m: [0.0, 0.0]
  thickness_m: 1.0e-4
  d_top_m: 3.0e-5
  d_waist_m: 2.0e-5
  d_bottom_m: 3.0e-5
  z_waist_m: 5.0e-5
  n_glass: 1.5
  n_air: 1.0
  voxelization: voxel_center_binary

multislice:
  operator: centered_symmetric_split_step
  slice_location: center_plane
  returned_field_plane: sample_a_exit_boundary
  target_dz_m: 1.0e-6
  use_true_slice_widths: true
  propagate_between_slices: true
  store_slice_fields: false

sample_b:
  type: random_phase
  phase_range_rad: 0.8
  physical_feature_size_m: 2.0e-6
  seed: 20260840
  canonical_grid:
    shape: [384, 384]
    dx_m: 2.5e-7
    fov_m: [9.6e-5, 9.6e-5]
  case_mapping: centered_crop_then_aligned_point_sampling
  same_physical_realization_for_all_cases: true
  object_boundary: periodic

scan:
  type: jittered_grid
  num_x: 5
  num_y: 5
  step_m: 4.0e-6
  center: true
  integer_pixel_shifts_only: true
  max_jitter_px: 1
  jitter_quantum_m: 1.0e-6
  jitter_seed: 20260841
  same_positions_for_all_cases: true

waist_perturbation:
  delta_d_waist_m: 2.0e-6
  case_ids: [waist_minus, baseline, waist_plus]
  d_waist_m: [1.8e-5, 2.0e-5, 2.2e-5]
  shared_incident_field: true
  shared_sample_b: true
  shared_scan: true
  shared_detector_model: true

convergence:
  comparison_mapping: centered_bilinear_interpolation_diagnostic_only
  comparison_mapping_is_detector_model: false
  axial:
    fixed_shape: [128, 128]
    fixed_dx_m: 5.0e-7
    dz_cases_m: [2.0e-6, 1.0e-6, 5.0e-7]
    acceptance_pair_m: [1.0e-6, 5.0e-7]
  lateral_fixed_fov:
    fov_m: [6.4e-5, 6.4e-5]
    cases:
      - shape: [64, 64]
        dx_m: 1.0e-6
      - shape: [128, 128]
        dx_m: 5.0e-7
      - shape: [256, 256]
        dx_m: 2.5e-7
    acceptance_pair_dx_m: [5.0e-7, 2.5e-7]
    comparison_grid_shape: [128, 128]
    comparison_grid_dx_m: 5.0e-7
  fov:
    fixed_dx_m: 5.0e-7
    shapes: [[128, 128], [160, 160], [192, 192]]
    common_center_roi_shape: [128, 128]
    common_center_roi_fov_m: [6.4e-5, 6.4e-5]
    acceptance_pair_shapes: [[160, 160], [192, 192]]

diagnostics_r1:
  enabled: false
diagnostics_r2:
  enabled: false
diagnostics_r3:
  enabled: false
diagnostics_r4:
  enabled: false
diagnostics_r5:
  enabled: false
diagnostics_r6:
  enabled: false
diagnostics_r7:
  enabled: false
diagnostics_r8:
  enabled: false

diagnostics_r9:
  enabled: true
  version: R9
  scientific_role: a_exit_raw_external_passband_restriction_and_axial_attribution
  methods:
    interface: q8_staggered_midpoint_air_area_fraction
    effective_index: linear_cell_average_of_indicator
    multislice: centered_symmetric_split_step_streamed_slices
    raw_comparison: unaligned_total_complex_field_relative_l2
    passband: exact_external_medium_propagating_disk
    passband_order: project_each_native_grid_then_restrict
    fourier_projection: ifft2_fft2_times_binary_mask
    bilinear_restriction: centered_bilinear_complex_field
    conservative_restriction: aligned_2x2_complex_cell_average
    spectral_attribution: orthogonal_parseval_inside_outside_energy
  r8_provenance:
    run: runs/exp040_TGV_3d_multislice_r8_unified_visibility_20260814_152034
    metrics_sha256: DADE29E7625B7FCEB904534B674DBAF31A37C86066A9A1870B22E9F618F3DA17
    hdf5_sha256: 5004947CDF767F3777E4356CCBE67BA75AD27F254D3EE978690B9ECC3AD776E7
    status: Inconclusive
    raw_axial_u_a_exit: 0.0709483058386522
    raw_lateral_u_a_exit: 0.20874412488300237
  interface:
    factor: 8
    node_rule: pixel_center_plus_a_half_over_q
    weights: uniform_nonnegative
    axial_subnodes: 1
  sample_a_cases:
    fov_m: [6.4e-5, 6.4e-5]
    cases:
      - id: axial_coarse
        shape: [256, 256]
        dx_m: 2.5e-7
        dz_m: 5.0e-7
        d_waist_m: 2.0e-5
      - id: common_reference
        shape: [256, 256]
        dx_m: 2.5e-7
        dz_m: 2.5e-7
        d_waist_m: 2.0e-5
      - id: axial_fine_reference
        shape: [256, 256]
        dx_m: 2.5e-7
        dz_m: 1.25e-7
        d_waist_m: 2.0e-5
      - id: lateral_fine_reference
        shape: [512, 512]
        dx_m: 1.25e-7
        dz_m: 2.5e-7
        d_waist_m: 2.0e-5
    r8_axial_reproduction_pair: [axial_coarse, common_reference]
    r8_axial_reproduction_reference: common_reference
    axial_refinement_pair: [common_reference, axial_fine_reference]
    axial_refinement_reference: axial_fine_reference
    lateral_pair: [common_reference, lateral_fine_reference]
    lateral_reference: lateral_fine_reference
    reuse_common_cases: true
    stream_slices: true
    retain_full_volumes: false
  physical_passband:
    medium_index_source: optics.external_medium_index
    cutoff_definition: external_medium_index_over_vacuum_wavelength
    cutoff_cycles_per_m: 1879699.2481203007
    mask_geometry: radial_disk_intersect_native_nyquist_rectangle
    boundary_inclusive: true
    frequency_axis: numpy_fft_fftfreq_cycles_per_m
    apply_to: total_complex_u_a_exit
  lateral_restrictions:
    methods: [centered_bilinear_complex_field, aligned_2x2_complex_cell_average]
    refinement_ratio: 2
    target_shape: [256, 256]
    target_dx_m: 2.5e-7
    cell_average_weights: [0.25, 0.25, 0.25, 0.25]
    compare_both_without_selection: true
  comparisons:
    raw_and_passband_outputs: [U_A_exit]
    r8_axial_denominator: common_reference
    axial_refinement_denominator: axial_fine_reference
    lateral_denominator: restricted_lateral_fine_reference
    passband_before_lateral_restriction: true
    phase_scale_spatial_alignment: false
    r8_reproduction_absolute_tolerance_source: acceptance.algebra_relative_l2_max
    restriction_equivalence_tolerance_source: acceptance.algebra_relative_l2_max
    difference_energy_fraction_is_report_only: true
  determinism:
    scope: repeated_passband_and_restriction_postprocessing
    case_id: lateral_fine_reference
  thresholds:
    reuse_acceptance_convergence_relative_l2_max: true
    reuse_acceptance_algebra_relative_l2_max: true
    reuse_acceptance_determinism_relative_l2_max: true

controls:
  geometry: true
  zero_contrast: true
  single_slice: true
  no_internal_propagation: true
  projected_phase_product: true
  axial_convergence: true
  lateral_convergence: true
  fov_convergence: true
  end_to_end_detector: true
  waist_visibility: true
  determinism_and_finite: true

acceptance:
  geometry_thickness_absolute_tolerance_m:
    fixed_floor_m: 1.0e-15
    floating_point_factor: 16.0
    rule: max(fixed_floor_m, floating_point_factor * eps_float64 * thickness_m)
  algebra_relative_l2_max: 1.0e-12
  zero_contrast_relative_l2_max: 1.0e-12
  single_slice_relative_l2_max: 1.0e-12
  projected_phase_product_relative_l2_max: 1.0e-12
  determinism_relative_l2_max: 1.0e-14
  convergence_relative_l2_max: 5.0e-2
  convergence_outputs: [U_A_exit, P_B, I_stack]
  require_all_finite: true
  detector_visibility_signal_to_floor_min: 3.0
  detector_floor_components: [axial, lateral, fov]
  detector_visibility_rule: min(waist_minus_signal, waist_plus_signal) / max(axial_floor, lateral_floor, fov_floor, eps_float64)
  report_only_signal_to_floor_outputs: [U_A_exit, P_B]

output:
  save_hdf5: true
  save_png: true
  save_slice_fields: false
  save_r1_figures: false
  save_r2_figures: false
  save_r3_figures: false
  save_r4_figures: false
  save_r5_figures: false
  save_r6_figures: false
  save_r7_figures: false
  save_r8_figures: false
  save_r9_figures: true
  hdf5_filename: exp040_multislice_r9_a_exit_attribution.h5
