experiment:
  id: exp042
  role: development_known_b_probe_reconstruction_baseline
  status: Development baseline / No scientific pass-fail conclusion

execution:
  mode: detector_quadrature_three_branch_control

provenance:
  source_experiment: exp040
  source_primary_document: docs/experiment_design/exp040_TGV_3d_multislice_forward.md
  source_branch: R8 unified q8 finite-B open q4 scalar working model
  source_formal_run: runs/exp040_TGV_3d_multislice_r8_unified_visibility_20260814_152034
  source_formal_config: configs/experiments/exp040_TGV_3d_multislice_r8_unified_visibility.yaml
  development_data_origin: deterministic matched regeneration with shared exp040 building blocks
  development_case_id: canonical_geometry_coarse_matched_dev
  reference_validated: false
  full_tgv_reference_authorized: false

optics:
  wavelength_m: 5.32e-7
  internal_reference_index: 1.5
  external_medium_index: 1.0
  z_AB_m: 5.0e-4
  z_BC_m: 1.0e-3
  angular_spectrum_bandlimit: true
  alias_control_external: true

illumination:
  amplitude: 1.0
  theta_x_rad: 0.0
  theta_y_rad: 0.0

sample_a:
  model: axisymmetric_tgv_q8_cell_average_scalar_multislice
  shape: [96, 96]
  dx_m: 5.0e-7
  thickness_m: 1.0e-4
  target_dz_m: 1.0e-6
  interface_factor: 8
  d_top_m: 3.0e-5
  d_waist_m: 2.0e-5
  d_bottom_m: 3.0e-5
  z_waist_m: 5.0e-5
  center_xy_m: [0.0, 0.0]
  n_glass: 1.5
  n_air: 1.0

probe_grid:
  plane: B
  axis_order: [y, x]
  native_shape: [96, 96]
  node_dx_m: 5.0e-7
  open_shape: [256, 256]
  native_fov_m: [4.8e-5, 4.8e-5]
  open_fov_m: [1.28e-4, 1.28e-4]
  residual_embedding: centered_zero_pad_of_P_B_minus_homogeneous_reference

sample_b:
  type: random_phase
  support_shape: [192, 192]
  physical_shape_m: [9.6e-5, 9.6e-5]
  canonical_phase_cells: [48, 48]
  feature_size_px: 4
  phase_range_rad: 0.8
  seed: 20260840
  exterior_transmission: [1.0, 0.0]
  shifted_quantity: B_minus_1
  shift_boundary: constant_zero

scan:
  type: exp040_r8_jittered_grid
  num_x: 5
  num_y: 5
  step_m: 4.0e-6
  center: true
  integer_pixel_shifts_only: true
  max_jitter_px: 1
  jitter_quantum_m: 1.0e-6
  jitter_seed: 20260841
  position_columns: [x, y]
  position_units: m

detector:
  model: q4_positive_staggered_midpoint_pixel_average
  quadrature_factor: 4
  node_dx_m: 5.0e-7
  pixel_size_m: 2.0e-6
  native_roi_shape: [32, 32]
  native_roi_fov_m: [6.4e-5, 6.4e-5]
  crop: centered_after_pixel_quadrature
  intensity_units: arbitrary

loss:
  type: mean_half_squared_pixel_intensity_residual
  uses_measured_pixel_intensity_directly: true
  amplitude_replacement: false

reconstruction:
  unknown: P_B_only
  known_sample_b: true
  update_sample_b: false
  initialization: homogeneous_reference_probe
  algorithm: batch_complex_gradient_descent_gn_scaled_armijo
  iterations: 60
  initial_step: 1.0
  curvature_recompute_interval: 1
  backtracking_factor: 0.5
  armijo_c: 1.0e-4
  max_backtracking_steps: 24
  minimum_step: 1.0e-12
  gradient_norm_stop: 0.0
  store_probe_history_for_posthoc_simulation_evaluation: true
  truth_used_by_optimizer: false
  initialization_stability_control:
    enabled: false
    role: truth_free_local_basin_diagnostic
    initialization: deterministic_zero_mean_complex_perturbation_of_primary
    seed: 20260843
    relative_l2_to_primary: 0.05
    zero_mean_perturbation: true
    reuse_primary_optimizer_settings: true
    pairwise_alignment: global_phase_only
    truth_used_by_initialization: false
  paired_continuation_control:
    enabled: false
    role: truth_free_equal_budget_paired_continuation
    start_fields: same_run_primary_and_control_raw_final
    additional_iterations: 60
    reuse_optimizer_settings: true
    pairwise_alignment: global_phase_only
    checkpoint_interval: 10
    truth_used_by_continuation: false
    truth_used_by_diagnostic: false
    scientific_thresholds_preregistered: false

verification:
  random_seed: 20260842
  finite_difference_relative_step: 1.0e-6
  truth_initialized_diagnostic_only: true
  scientific_thresholds_preregistered: false
  detector_quadrature_ablation:
    enabled: true
    role: truth_free_equal_budget_detector_data_model_pairing_control
    primary_data_model: q4_positive_staggered_midpoint_pixel_average
    control_data_model: bilinear_midpoint_point_from_q4_nodes
    sweep_axis: detector_data_and_reconstruction_readout_pairing
    point_interpolation: bilinear_average_of_central_2x2_complex_q4_nodes
    branches:
      - name: matched_q4
        data_source: primary_q4_data
        data_readout: positive_pixel_average
        detector_readout: positive_pixel_average
        model_role: exp040_matched_reference
      - name: mismatch_q1_point
        data_source: primary_q4_data
        data_readout: positive_pixel_average
        detector_readout: bilinear_midpoint_point_from_q4_nodes
        model_role: explicit_mismatch_diagnostic
      - name: matched_q1_point
        data_source: q1_point_control_data
        data_readout: bilinear_midpoint_point_from_q4_nodes
        detector_readout: bilinear_midpoint_point_from_q4_nodes
        model_role: simplified_matched_control_not_exp040_matched
    reference_branch: matched_q4
    primary_q4_data_branches: [matched_q4, mismatch_q1_point]
    same_truth_b_scan_initialization: true
    equal_optimizer_settings: true
    equal_iteration_budget: 60
    checkpoint_interval: 5
    pairwise_alignment: global_phase_only_diagnostic_convention
    comparison_contract:
      matched_q4_vs_mismatch_q1_point: reconstruction_readout_mismatch_on_shared_q4_data
      mismatch_q1_point_vs_matched_q1_point: q4_vs_q1_data_with_shared_q1_reconstruction_model
      matched_q4_vs_matched_q1_point: matched_detector_model_family_effect
    numerical_control_tolerances:
      point_readout_adjoint_relative_error: 1.0e-12
      intensity_jacobian_adjoint_relative_error: 1.0e-11
      full_loss_directional_gradient_relative_error: 2.0e-6
    figure_panels:
      - loss_curve
      - detector_relative_residual_curve
      - raw_probe_error_simulation_evaluation_only
      - aligned_probe_error_simulation_evaluation_only
      - checkpoint_raw_probe_distance_to_reference
      - checkpoint_aligned_probe_distance_to_reference
      - checkpoint_prediction_distance_to_reference
      - final_aligned_probe_distance_matrix
    truth_used_by_initialization: false
    truth_used_by_optimizer: false
    truth_used_by_branch_selection: false
    truth_used_by_stopping: false
    simulation_truth_evaluation_only: true
    scientific_thresholds_preregistered: false
    q1_branch_is_exp040_matched: false
    q1_q1_matched_control_included: true
  initialization_ablation:
    enabled: false
    role: truth_free_equal_budget_initialization_magnitude_ablation
    initialization_family: fixed_direction_magnitude_sweep
    sweep_axis: perturbation_relative_l2_to_homogeneous
    fixed_perturbation_seed: 20260843
    magnitude_levels: [0.0, 0.01, 0.025, 0.05]
    same_perturbation_direction: true
    same_direction_max_unit_l2_error_tolerance: 1.0e-12
    figure_panels:
      - loss_curve
      - detector_relative_residual_curve
      - raw_probe_error_simulation_evaluation_only
      - aligned_probe_error_simulation_evaluation_only
      - checkpoint_raw_probe_distance_to_reference
      - checkpoint_aligned_probe_distance_to_reference
      - checkpoint_prediction_distance_to_reference
      - final_aligned_probe_distance_matrix
    branches:
      - name: homogeneous_reference
        kind: homogeneous_reference_probe
        relative_l2_to_homogeneous: 0.0
      - name: perturb_1pct
        kind: deterministic_zero_mean_complex_perturbation
        relative_l2_to_homogeneous: 0.01
      - name: perturb_2p5pct
        kind: deterministic_zero_mean_complex_perturbation
        relative_l2_to_homogeneous: 0.025
      - name: perturb_5pct
        kind: deterministic_zero_mean_complex_perturbation
        relative_l2_to_homogeneous: 0.05
    reference_branch: homogeneous_reference
    equal_optimizer_settings: true
    equal_iteration_budget: 60
    checkpoint_interval: 5
    pairwise_alignment: global_phase_only_diagnostic_convention
    common_metrics:
      - loss_curve
      - detector_relative_residual_curve
      - probe_raw_relative_l2_curve_simulation_evaluation_only
      - probe_global_phase_aligned_relative_l2_curve_simulation_evaluation_only
      - initial_pairwise_raw_probe_relative_l2
      - initial_pairwise_global_phase_aligned_probe_relative_l2
      - final_pairwise_raw_probe_relative_l2
      - final_pairwise_global_phase_aligned_probe_relative_l2
      - final_pairwise_prediction_relative_l2
      - checkpoint_pairwise_raw_probe_relative_l2_curve
      - checkpoint_pairwise_global_phase_aligned_probe_relative_l2_curve
      - checkpoint_pairwise_prediction_relative_l2_curve
      - iterations_completed
      - stopping_reason
    truth_used_by_initialization: false
    truth_used_by_optimizer: false
    truth_used_by_branch_selection: false
    truth_used_by_stopping: false
    simulation_truth_evaluation_only: true
    scientific_thresholds_preregistered: false
  pairwise_conditioning:
    enabled: false
    role: truth_free_local_jacobian_conditioning
    base_probe: primary_final_reconstruction
    direction: global_phase_aligned_control_minus_primary
    direction_normalization: unit_probe_l2
    jacobian_output_norm: rms_over_detector_stack
    random_seed: 20260844
    random_direction_count: 8
    random_direction_distribution: zero_mean_complex_gaussian
    include_primary_gradient_direction: true
    include_native_global_phase_rotation_comparator: true
    truth_used_by_diagnostic: false
    scientific_thresholds_preregistered: false
  local_spectral_diagnostic:
    enabled: false
    role: truth_free_matrix_free_local_jtj_lanczos
    source_run: runs/exp042_TGV_3d_multislice_probe_reconstruction_dev_20260822_140501
    source_config_sha256: 586C7DE5C775DC8BB4956D0C04700FB29FB7388788D3D18275D1CC315CED5F5A
    source_metrics_sha256: D0E760FBDDDE1741ED23FFEA02EC13C3A026E35C2B9AE2738BCBDD94BF8B7823
    source_hdf5_relative_path: outputs/exp042_probe_reconstruction.h5
    source_hdf5_sha256: 37B9DB85256026C97E720657D93DEF91DD5F7119DE29B3657DDCBC87986D4771
    source_primary_probe_hdf5_path: entry/reconstruction/paired_continuation_control/primary/P_B_rec
    source_control_probe_hdf5_path: entry/reconstruction/paired_continuation_control/control/P_B_rec
    base_probe: source_primary_continuation_final_raw
    direction: global_phase_aligned_source_control_continuation_final_minus_primary
    matrix_operator: real_intensity_jacobian_transpose_times_jacobian
    matrix_normalization: mean_over_detector_stack
    krylov_dimension: 24
    start_vectors:
      - pairwise_direction
      - deterministic_zero_mean_complex_gaussian
    random_seed: 20260845
    reorthogonalization: full_two_pass
    reorthogonalization_passes: 2
    breakdown_relative_tolerance: 1.0e-12
    reported_low_ritz_count: 3
    truth_used_by_diagnostic: false
    scientific_thresholds_preregistered: false
    dimension_convergence_control:
      enabled: true
      role: bounded_12_to_24_krylov_dimension_extension
      reference_run: runs/exp042_TGV_3d_multislice_probe_reconstruction_dev_20260822_144251
      reference_config_sha256: 92F6BCC163A8427889CA10E9ACF9632BA34C13928643DB20BA16B9FF81118FE8
      reference_metrics_sha256: 3D777C2FF7DF1E72AA4EAA26C82AB542E0E856341B7D26901AD7D64DC0DECE0E
      reference_hdf5_relative_path: outputs/exp042_probe_reconstruction.h5
      reference_hdf5_sha256: 35C8452199C53931513E4501EC78080B7D5EC513962A8E630E17AE8FCA34C47C
      reference_krylov_dimension: 12
      extended_krylov_dimension: 24
      recurrence_prefix_dimension: 12
      comparison_quantities:
        - recurrence_prefix
        - lowest_ritz_value
        - lowest_ritz_residual
        - lowest_ritz_residual_to_value
        - lowest_ritz_spectral_weight
        - lowest_three_ritz_spectral_weight
        - spectral_weighted_median_ritz_value
      same_source_operator_starts_and_seed: true
      single_extension_only: true
      truth_used_by_control: false
      scientific_thresholds_preregistered: false

output:
  root: runs
  run_name: exp042_TGV_3d_multislice_probe_reconstruction_dev
  hdf5_filename: exp042_probe_reconstruction.h5
  figure_filenames:
    - exp042_convergence.png
    - exp042_probe_comparison.png
    - exp042_detector_residual.png
    - exp042_initialization_stability.png
    - exp042_pairwise_conditioning.png
    - exp042_paired_continuation.png
  spectral_figure_filename: exp042_local_spectral_diagnostic.png
  initialization_ablation_figure_filename: exp042_initialization_magnitude_ablation.png
  detector_quadrature_ablation_figure_filename: exp042_detector_quadrature_three_branch_control.png
