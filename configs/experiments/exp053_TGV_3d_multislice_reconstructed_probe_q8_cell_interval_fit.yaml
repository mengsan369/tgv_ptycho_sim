  internal_alias_control: false
  external_bandlimit: true
  external_alias_control: true
  axis_order: [y, x]
  complex_dtype: complex128

fit:
  primary_loss: raw_complex_normalized_squared_l2
  mask: full_native_field_all_true
  weighting: equal_per_complex_pixel
  phase_or_scale_alignment: none
  true_d_waist_m_simulation_evaluation_only: 2.0e-5
  bounds_m: [1.6e-5, 2.4e-5]
  coarse_grid_m: [1.6e-5, 1.7e-5, 1.8e-5, 1.9e-5, 2.0e-5, 2.1e-5, 2.2e-5, 2.3e-5, 2.4e-5]
  fine_half_width_m: 5.0e-7
  fine_step_m: 1.25e-7
  optimizer:
    algorithm: fixed_budget_bounded_pattern_search
    starts_m: [1.65e-5, 1.85e-5, 2.15e-5, 2.35e-5]
    initial_step_m: 2.0e-6
    evaluation_budget_per_start: 43
    stopping_reason: evaluation_budget
    representative_estimate: midpoint_of_common_q8_field_equivalence_component
    numerical_closure_control:
      baseline_evaluation_budget_per_start: 41
      additional_complete_pattern_updates_per_start: 1
      evaluations_per_pattern_update: 2
      added_evaluations_per_start: 2
      selection_basis: existing_raw_target_loss_and_41_call_tracks_only
      equal_budget_all_starts: true
      truth_used_for_method_parameter_or_stopping_selection: false

reconstruction_aware_interval:
  primary_definition: connected_best_candidate_q8_field_equivalence_component
  q8_interface_method: subpixel_midpoint_count
  q8_interface_factor: 8
  source_exact_boundary_control:
    method: bounded_float64_nextafter_transition_scan
    max_ulps_each_direction: 8
    lower_boundary_definition: first_representable_member_after_outside
    upper_boundary_definition: first_representable_outside_after_member
    membership_contract: tau_primary_exact_field_and_node_count_all_agree
    primary_boundary_reference: source_exact_float64_membership_transition
    analytic_breakpoint_role: retained_algebraic_diagnostic_only
    truth_used_for_mapping_selection_or_stopping: false
  field_equivalence_threshold:
    primary_relative_l2: 1.0e-12
    low_factor: 0.1
    high_factor: 10.0
  screened_loss_tie_absolute: 1.0e-14
  max_adjacent_cells_per_direction: 256
  boundary_bisection_iterations: 24
  thresholds:
    candidate_operator_replay_relative_l2_max: 1.0e-14
    deterministic_repeat_relative_l2_max: 1.0e-14
    boundary_resolution_m_max: 1.0e-12
    interval_width_m_max: 1.25e-7
    truth_to_interval_distance_m_max_simulation_evaluation_only: 1.25e-7
    endpoint_absolute_error_m_max_simulation_evaluation_only: 1.25e-7
    endpoint_relative_error_max_simulation_evaluation_only: 0.00625
    boundary_margin_m: 1.25e-7
  directional_diagnostic:
    trigger: experiment_not_passed_or_truth_outside_reported_interval
    finite_change_offsets_m: [-1.25e-7, 1.25e-7]
    enters_fitter: false
    simulation_evaluation_only: true

