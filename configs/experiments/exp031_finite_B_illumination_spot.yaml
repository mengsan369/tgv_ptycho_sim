run:
  name: exp031_finite_B_illumination_spot
  output_root: runs

experiment:
  id: exp031
  phase: Phase 3
  status: passed_2D_preregistered_numerical_problem
  document_version: exp031-v9
  change_id: Change 06

optics:
  dx_m: 2.5e-7
  wavelength_m: 5.32e-7
  z_AB_m: 1.0e-3
  z_BC_m: 1.0e-3
  medium_index: 1.0
  detector_pixel_size_m: 2.5e-7
  detector_roi_shape: [384, 384]
  propagation_precision: complex64
  bandlimit: true
  alias_control: true

tgv:
  type: single_axisymmetric_air_filled_via_in_glass
  thickness_m: 7.0e-4
  d_top_m: 5.0e-5
  d_waist_m: 3.33e-5
  d_bottom_m: 5.0e-5
  z_waist_m: 3.5e-4
  n_glass: 1.5
  n_air: 1.0
  center_xy_m: [0.0, 0.0]

projected_phase:
  approximation: axial_projected_phase_relative_to_glass
  integration_method: analytic_piecewise_linear_path
  phase_scale: 1.0
  radial_core_step_m: 5.0e-8
  radial_transition_step_m: 1.0e-9
  radial_output_step_m: 1.25e-7

illumination:
  gaussian_waist_plane: effective_A_plane
  center_xy_m: [0.0, 0.0]
  zero_tilt: true
  zero_extra_quadratic_curvature: true
  astigmatism: false
  plate_edge_clipping: false
  spot_diameter_1e2_intensity_m: [5.0e-5, 1.0e-4, 2.0e-4, 4.0e-4]
  include_plane_wave_fixed_center: true
  fixed_total_incident_power: 1.0
  fixed_center_amplitude: 1.0

active_window:
  geometry: centered_square
  formal_omitted_incident_power_max: 1.0e-3
  strict_omitted_incident_power_max: 1.0e-4
  strict_control_spot_diameter_m: [5.0e-5, 4.0e-4]
  residual_support_spot_diameter_m: 5.0e-5
  residual_support_omitted_incident_power_max: 1.0e-7
  residual_support_control_omitted_incident_power_max: 1.0e-8
  probe_envelope_comparison_shape: [352, 352]
  plane_wave_legacy_shape: [384, 384]
  align_to_feature_cells: true
  preserve_centered_parity: true
  edge_ring_width_m: 4.0e-6

sample_b:
  type: finite_aperiodic_random_phase_cells
  phase_range_rad: 0.8
  feature_size_m: 2.0e-6
  seed: 20260731
  guard_feature_cells_per_side: 1
  exterior_transmission_real: 1.0
  exterior_transmission_imag: 0.0

scan:
  type: jittered_grid
  num_x: 7
  num_y: 7
  step_m: 8.0e-6
  center: true
  max_jitter_px: 1
  jitter_quantum_m: 5.0e-7
  jitter_seed: 20260732
  position_columns: [x, y]
  position_units: m

sensitivity:
  delta_d_waist_m: 4.8828125e-10
  epsilon_relative: 1.0e-12
  poisson_mu_epsilon: 1.0e-15

open_boundary:
  padding_guard_m_per_side: 6.4e-5
  padding_control_spot_diameter_m: 1.0e-4
  padding_sequence_guard_m_per_side: [3.2e-5, 6.4e-5, 1.28e-4]
  padding_control_guard_m_per_side: 1.28e-4
  fft_workers: 1

negative_control:
  periodic_b_spot_diameter_m: 1.0e-4
  normalization_branch: fixed_center_intensity

reconstruction:
  enabled_if_primary_gates_pass: true
  role: secondary_matched_known_B_probe_only
  representative_cases: [gaussian_100um, gaussian_400um, plane_wave]
  num_iterations: 1
  beta_probe: 0.25
  initialization: analytic_reference_scaled_by_measured_detector_energy
  stopping_and_selection: fixed_measurement_only_schedule
  truth_used_by_optimizer: false

gates:
  adjoint_relative_error_max: 1.0e-12
  numerical_relative_change_max: 0.05
  residual_edge_energy_fraction_max: 2.0e-3
  minimum_coverage_margin_strictly_positive: true
  periodic_wrap_count_max: 0

reporting:
  small_relative_change_max_exclusive: 0.05
  moderate_relative_change_max_exclusive: 0.20
  low_signal_fraction_of_peak: 1.0e-4
  detector_percentile_high: 99.9
  detector_percentile_low: 1.0

preflight:
  maximum_peak_memory_bytes: 4.0e9
  maximum_estimated_runtime_s: 7200.0

output:
  save_png: true
  save_hdf5: true
  hdf5_filename: exp031_finite_B_illumination_spot.h5
